<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键帧动画测试</title><link rel="stylesheet" href="/tool-navigation.css"><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e6edf6;font:15px system-ui}main{max-width:1260px;margin:auto;padding:32px}h1{margin:0;font-size:32px}p{color:#aab9ce;line-height:1.8}.badge{color:#71e4c6}.layout{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:24px}.panel{background:#1a2230;border:1px solid #344154;border-radius:16px;padding:22px}canvas{width:100%;max-height:540px;object-fit:contain;background:repeating-conic-gradient(#202c3b 0% 25%,#253243 0% 50%) 50%/24px 24px;border-radius:10px}button,select,a.download{background:#293a50;color:#edf6ff;border:1px solid #50617a;border-radius:8px;padding:10px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}input[type=range]{width:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare img{width:100%;background:#ddd;border-radius:8px}a{color:#8edacc}#contacts{display:flex;flex-wrap:wrap;gap:4px}#contacts img{width:96px;background:#263342}small{color:#b3c3d7}#status{min-height:40px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:16px}}</style><body><main><span class="badge">原设计角色 · 真实二维位图序列</span><h1>关键帧动画测试</h1><p id="character-description">选择角色查看真实关键姿势与二维连续帧。</p><nav class="controls" aria-label="移动动作快捷入口"><button data-action="walk">向前走 · 读取进度</button><button data-action="run">疾跑 · 读取进度</button><button data-action="turn">转身 · 读取进度</button></nav><div class="layout"><section class="panel"><canvas id="preview" width="512" height="512" aria-label="角色二维连续帧预览"></canvas><div class="controls"><select id="character" aria-label="角色选择"></select><select id="action" aria-label="动作选择"><option value="punch">出拳 · 版本对照</option></select><select id="version" aria-label="插帧版本"><option value="design-frames-v2">v2 · MCI运动插帧（失败证据）</option><option value="design-frames-v6-fixed-stance" selected>v6 固定脚位 · 美术自测通过</option><option value="design-frames-v4-clear">v4 清晰重绘 · QA候选</option><option value="design-frames-v3">v3 · RIFE失败对照</option></select></div><div class="controls"><button id="play" disabled>播放</button><button id="prev" disabled>上一帧</button><button id="next" disabled>下一帧</button><select id="fps" aria-label="帧率"><option value="12">12 FPS</option><option value="8">8 FPS</option><option value="6">6 FPS</option></select><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="0.25">0.25× 慢放</option></select></div><input id="seek" type="range" min="0" max="11" value="0" aria-label="逐帧时间轴"><small id="frame">读取序列中</small><p id="status" role="status">正在读取实际帧…</p><div id="downloads" class="controls"></div></section><aside class="panel"><h2>连续帧图集</h2><img id="sheet" style="width:100%" alt="角色连续帧图集"><p>检查动作顺序、前后肢交替、身体比例、脸部与帧间连续性。先检查 4 张关键姿势，再检查 12 帧的动作连续性。各版本的中间帧方法、复用与停留帧以来源记录为准。</p><a href="/model-frame-extraction">查看建模抽帧问题对照</a></aside></div><section class="panel" style="margin-top:22px"><h2>逐帧接触表</h2><div id="contacts"></div></section><section class="panel" style="margin-top:22px"><h2>本地资产与原始关键帧</h2><div id="keyframes" class="compare"></div><div id="asset-links" class="controls"></div><h2>真实模型静态预览</h2><p>以下为已保存模型预览与下载；不同渲染机位仅作外形参考，不作为严格量化对照。</p><div id="models" class="compare"></div></section></main><script type="module" src="/tool-navigation.mjs"></script><script type="module" src="/keyframe-animation-test.mjs"></script></body></html>
