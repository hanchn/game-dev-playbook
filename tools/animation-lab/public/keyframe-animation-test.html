<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键帧动画测试</title><link rel="stylesheet" href="/tool-navigation.css"><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e6edf6;font:15px system-ui}main{max-width:1260px;margin:auto;padding:32px}h1{margin:0;font-size:32px}p{color:#aab9ce;line-height:1.8}.badge{color:#71e4c6}.layout{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:24px}.panel{background:#1a2230;border:1px solid #344154;border-radius:16px;padding:22px}canvas{width:100%;max-height:540px;object-fit:contain;background:repeating-conic-gradient(#202c3b 0% 25%,#253243 0% 50%) 50%/24px 24px;border-radius:10px}button,select,a.download{background:#293a50;color:#edf6ff;border:1px solid #50617a;border-radius:8px;padding:10px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}input[type=range]{width:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare img{width:100%;background:#ddd;border-radius:8px}a{color:#8edacc}#contacts{display:flex;flex-wrap:wrap;gap:4px}#contacts img{width:96px;background:#263342}small{color:#b3c3d7}#status{min-height:40px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:16px}}</style><body><main><span class="badge">原设计角色 · 真实二维位图序列</span><h1>关键帧动画测试</h1><p>奶蛙二维关键姿势与中间帧连续播放。此页使用图生序列帧，不是 3D 模型抽帧。</p><div class="layout"><section class="panel"><canvas id="preview" width="512" height="512" aria-label="奶蛙二维连续帧预览"></canvas><div class="controls"><button id="play" disabled>播放</button><button id="prev" disabled>上一帧</button><button id="next" disabled>下一帧</button><select id="fps" aria-label="帧率"><option value="12">12 FPS</option><option value="8">8 FPS</option><option value="6">6 FPS</option></select><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="0.25">0.25× 慢放</option></select></div><input id="seek" type="range" min="0" max="11" value="0" aria-label="逐帧时间轴"><small id="frame">读取序列中</small><p id="status" role="status">正在读取实际帧…</p><div id="downloads" class="controls"></div></section><aside class="panel"><h2>连续帧图集</h2><img id="sheet" style="width:100%" alt="奶蛙原始12帧图集"><p>检查动作顺序、前后肢交替、身体比例、脸部与帧间连续性。4 张绘制关键姿势，经运动插帧补到 12 帧；插帧可能有重影，需继续验收。</p><a href="/model-frame-extraction">查看建模抽帧问题对照</a></aside></div><section class="panel" style="margin-top:22px"><h2>逐帧接触表</h2><div id="contacts"></div></section></main><script type="module" src="/tool-navigation.mjs"></script><script type="module" src="/keyframe-animation-test.mjs"></script></body></html>
