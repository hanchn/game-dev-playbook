<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恐龙腿部源图复测</title><link rel="stylesheet" href="/tool-navigation.css"><style>body{margin:0;background:#e9eef0;color:#17333d;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:8px}.controls{display:flex;flex-wrap:wrap;gap:16px;padding:18px;background:white;border-radius:8px}select,button{font:inherit;min-height:44px}label{display:flex;align-items:center;gap:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{display:block;background:white;width:100%;height:auto}figure{margin:18px 0}figcaption{font-weight:700}input[type=range]{width:100%}.note{background:#fff0d9;padding:16px;border-radius:8px}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><script type="module" src="/tool-navigation.mjs"></script><main><h1>恐龙腿部 · 原版与候选</h1><p>同机位、同相位；左侧保存旧 v12，右侧可比较源图和骨长。当前工坊 v13 已接入局部腿部修复，整体美术仍未通过。</p><div class="controls"><label>动作<select id="clip"><option value="idle">待机</option><option value="walk">行走</option><option value="run">快走</option><option value="jump">跳跃</option><option value="bite">咬合</option><option value="roar">吼叫</option><option value="tail">甩尾</option><option value="extend">单关节弯曲</option></select></label><label>衔接位<select id="joint"><option value="leg-0-upper">近侧髋／股段</option><option value="leg-0-middle">近侧膝／胫段</option><option value="leg-0-lower">近侧踝／跖段</option><option value="leg-0-foot">近侧趾根／脚爪</option><option value="leg-1-upper">远侧髋／股段</option><option value="leg-1-middle">远侧膝／胫段</option><option value="leg-1-lower">远侧踝／跖段</option><option value="leg-1-foot">远侧趾根／脚爪</option></select></label><label>速度<select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><label>背景<select id="background"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>骨长候选<select id="proportion"><option value="0">原骨架32 / 髋-80</option><option value="1">股段36 / 髋-78</option><option value="2" selected>当前 v13：股段40 / 髋-78</option><option value="3">股段40 / 髋-74</option></select></label><label><input id="zoom" type="checkbox">腿部固定放大（局部检视）</label><label><input id="bones" type="checkbox">显示真实关节链</label><button id="play">播放</button><button id="save">导出本次对照 PNG</button></div><p id="status" role="status">正在校验源图…</p><input id="phase" aria-label="动作相位" type="range" min="0" max="1000" step="1" value="0"><output id="phase-readout">0.000</output><div class="pair"><figure><figcaption>旧版 v12 · 固定快照</figcaption><canvas id="baseline" width="512" height="512" aria-label="原版恐龙动作"></canvas></figure><figure><figcaption>新源候选 · 未验收</figcaption><canvas id="candidate" width="512" height="512" aria-label="候选恐龙动作"></canvas></figure></div><p class="note">三段骨链分别是股骨、胫骨、跖骨。外轮廓不应包含额外拐点或脚掌；每处球面重叠仍需检查。身体比例、颈部、尾根和完整步态也未因本页自动通过。</p><a href="/lab/dinosaur">返回恐龙零件工坊</a> · <a href="/qa-evidence/dinosaur-leg-straight-v1/manifest.json">来源及固定画布记录</a></main><script type="module" src="/dinosaur-leg-review.mjs"></script></html>
