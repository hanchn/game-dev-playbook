<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键帧生成器 · 游戏开发工具</title><link rel="stylesheet" href="/keyframe-generator.css"><link rel="stylesheet" href="/tool-navigation.css"><script type="module" src="/tool-navigation.mjs"></script></head><body><header><a href="/lab">← 角色工坊</a><strong>关键帧生成器</strong><span>生成 · 调姿 · 插值 · 导出</span></header><main><aside><h1>让动作有明确的姿势</h1><p class="hint">基于当前角色的真实贴图。修改关节时，下游配件跟随，骨段长度保持不变。</p><label>角色<select id="character"></select></label><label>基础动作<select id="clip"></select></label><label>采样关键帧数<input id="count" type="number" min="2" max="65" value="9"></label><button id="generate" class="primary">重新生成关键帧</button><hr><label>动作名称<input id="name"></label><label>时长（秒）<input id="duration" type="number" min=".05" max="120" step=".05"></label><label class="check"><input id="loop" type="checkbox">循环播放</label><label>当前段缓动<select id="easing"><option value="smooth">平滑</option><option value="linear">匀速</option><option value="ease-in">加速</option><option value="ease-out">减速</option><option value="hold">保持姿势</option></select></label><div class="two"><button id="save">保存本机草稿</button><button id="restore">恢复草稿</button></div><hr><button id="export-json">导出可编辑 JSON</button><button id="export-poses">导出 32 帧姿势数据</button><button id="export-png">导出 16 帧透明 PNG 图集</button><label class="import">导入关键帧 JSON<input id="import" type="file" accept="application/json,.json"></label></aside><section class="workspace"><div class="toolbar"><span id="identity">正在加载贴图</span><label>背景<select id="background"><option value="dark">深色</option><option value="light">浅色</option></select></label><label class="check"><input id="bones" type="checkbox">骨架</label></div><div id="stage"><canvas id="preview" width="768" height="512"></canvas></div><div class="transport"><button id="play">▶ 播放</button><input id="scrub" type="range" min="0" max="1" step=".001" value="0"><output id="time">0.000 s</output></div><div class="timeline-heading"><strong>关键帧时间轴</strong><button id="add">＋ 在当前时间插入</button><button id="delete">删除所选</button><button id="close-loop">同步循环端点</button></div><div id="timeline"></div><div class="editor"><label>关节<select id="joint"></select></label><label>局部角度（°）<input id="angle" type="number" step="1"></label><label>关键帧时间（%）<input id="key-time" type="number" min="0" max="100" step=".1"></label><div class="two"><label>整体位移 X<input id="root-x" type="number" step="1"></label><label>整体位移 Y<input id="root-y" type="number" step="1"></label></div><p id="selection-note"></p></div><div id="status" role="status">准备中…</div><p class="limits">这是动作编辑与 QA 辅助工具。插值不会自动锁脚或修正碰撞；循环端点须手动同步。角色素材和关节接缝的美术问题仍需实际看图检查。</p></section></main><script type="module" src="/keyframe-generator.mjs"></script></body></html>
