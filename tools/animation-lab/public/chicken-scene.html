<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>鸡群动作场景 · 游戏开发工坊</title><link rel="stylesheet" href="/tool-navigation.css"><script type="module" src="/tool-navigation.mjs"></script><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ee;color:#18382c;font:15px/1.6 system-ui}main{max-width:1400px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:28px}p{color:#61736a}a{color:#246e52}section{background:white;border:1px solid #d7e2d8;border-radius:12px;padding:20px;margin:20px 0}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}button,select{font:inherit;padding:9px 15px;border:1px solid #b9ccc0;border-radius:6px;background:white;color:#194a37;cursor:pointer}.primary{background:#256c50;color:white}canvas{width:100%;height:auto;display:block;background:#17352d;border-radius:8px}input[type=range]{flex:1;min-width:160px}#actors{display:flex;gap:10px;flex-wrap:wrap}.actor{padding:10px 14px;border:1px solid #d9e4dd;border-radius:8px}small{color:#63786b}output{font-variant-numeric:tabular-nums}@media(max-width:700px){main{padding:16px}header{display:block}}
</style></head><body><main><header><div><small>角色表演 · 固定画布 1280 × 720</small><h1>鸡的动作拍摄</h1><p>独立相位、朝向和动作过渡。使用零件工坊当前真实鸡素材。</p></div><a href="/lab/chicken">返回鸡的零件与关节检查 →</a></header><section><div class="controls"><label>场景 <select id="scenario"><option value="flock">多只鸡 · 行走与啄食</option><option value="lay">母鸡下蛋 · 待美术验收</option><option value="crow">公鸡打鸣 · 待美术验收</option><option value="fight">双鸡格斗与掉毛 · 待美术验收</option></select></label><label id="flock-sex-label">公母 <select id="flock-sex"><option value="mixed" selected>公母混合</option><option value="hen">全母鸡</option><option value="rooster">全公鸡</option></select></label><label>鸡的数量 <select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option><option>9</option><option>12</option></select></label><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label><button id="play" class="primary">暂停</button><button id="restart">重新开始</button><button id="sound" aria-pressed="false">预览声音：关</button><button id="png">导出当前帧 PNG</button><button id="json">导出场景与动作 JSON</button><button id="record" class="primary">拍摄一轮 · 6 秒</button><button id="cancel" hidden>停止拍摄</button><span id="status" role="status">加载真实贴图…</span></div></section><canvas id="stage" width="1280" height="720" aria-label="多只鸡的独立动作预览"></canvas><section id="film" hidden><h2>本次成片</h2><video id="movie" controls playsinline style="width:100%;max-height:540px"></video><div class="controls"><button id="movie-save">下载视频</button><button id="sequence-save">下载视频与逐帧 PNG 包</button></div><p id="capture-summary"></p></section><section><div class="controls"><label for="time">场景时间</label><input id="time" type="range" min="0" max="6000" step="10" value="0"><output id="clock">0.00 / 6.00 s</output></div><div id="actors"></div><p id="source"></p><p>下蛋使用独立母鸡、蛋和窝；打鸣使用配准后的开合嘴型和真实录音，拍摄自动带音轨；预览声音可单独开启。新场景可拍摄，仍在美术复测。格斗使用双鸡相向起跳、接触、退回及独立羽毛飞散；接触力度、蹬地与羽毛材质仍需美术复测。</p><a href="/art-qa">查看源图及动作修复状态</a></section></main><script type="module" src="/chicken-scene.mjs"></script></body></html>
