<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2D / 2.5D 帧动画库 · 招式库</title><link rel="stylesheet" href="style.css"><body><header><span class="logo">◈</span><div><small>GAME ASSET COLLECTION</small><h1>2D 帧动画库 · 招式库</h1></div><span id="counts"></span></header><nav><a href="http://127.0.0.1:4317/combat-2d" style="align-self:center;padding:12px;color:#a8d8ff">← 游戏开发工坊</a><button data-tab="characters" class="active">帧动画库</button><button data-tab="moves">招式库 / 双角色演示</button><button data-tab="catalog">街机 Top 100 · 收录进度</button><button data-tab="sources">资源来源</button><a href="original-study.html" style="align-self:center;padding:12px;color:#a8d8ff">原版街霸 · 逐帧研究 ↗</a></nav><div id="gameTabs" role="tablist" aria-label="按游戏切换"></div><p id="gameSummary"></p><div id="pendingGame" hidden></div><main><aside><label>搜索角色 / 招式<input id="search" placeholder="输入名称、ID 或属性"></label><details id="advancedFilters"><summary>高级筛选</summary><select id="styleFilter" aria-label="画风筛选"><option value="">全部画风</option></select><select id="seriesFilter" aria-label="系列筛选"><option value="">全部系列</option></select><select id="filter"><option value="">全部分类</option></select></details><div id="list"></div></aside><section><div id="demo"><div class="topline"><div><small id="eyebrow">FRAME ANIMATION</small><h2 id="title"></h2></div><span id="badge"></span></div><div class="key-help">WASD: A / Arrow keys: B / J: Attack / K: Heavy / 1-4 or QERF: Skills / Space: Dodge / Shift: Sprint. Click the arena to enable keyboard controls.</div><canvas id="stage" width="1000" height="520" tabindex="0" aria-label="动画演示场景，方向键移动角色，空格施放招式"></canvas><div class="controls"><button id="autoBattle" aria-pressed="false">▶ 自动对打</button><button id="play">暂停</button><button id="step">下一帧</button><button id="cast">施放当前招式</button><button id="normalAttack">J 普攻</button><button id="superMove">大招 / 超必杀</button><button id="heavyAttack">K 重击</button><button id="dodge">空格 闪避</button><button id="swap">交换攻守</button><button id="reset">重置</button><button id="testKO">测试完整KO过渡</button><label>速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label></div><div id="skillSlots" class="skill-slots"></div><div class="controls"><input id="matchSeries" type="checkbox" checked hidden><b>同系列成套对战</b><span id="suiteLabel"></span></div><div class="controls"><label><input id="useCooldown" type="checkbox"> 使用原作技能冷却</label><label><input id="autoHeal" type="checkbox" checked> 打空血后自动恢复</label></div><div class="selectors"><label>角色 A<select id="actorA"></select></label><label>角色 B<select id="actorB"></select></label><label>动作<select id="action"></select></label><label>方向<select id="direction"><option value="down">前 ↓</option><option value="up">后 ↑</option><option value="left">左 ←</option><option value="right">右 →</option></select></label><label>特效<select id="effect"></select></label></div><div id="actionGroups" class="controls"></div><p id="phase"></p><div id="details"></div><div class="controls"><button id="export">导出当前配置 JSON</button><button id="package">下载角色完整资源包</button><button id="sheet">下载当前动作图</button><button id="capture">保存当前画面 PNG</button></div></div><div id="catalog" hidden></div><div id="sources" hidden></div></section></main><script type="module" src="app.mjs"></script></body></html>
