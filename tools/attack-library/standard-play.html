<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标准街机 · 原游戏运行</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf3fb;font:16px system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:27px}a{color:#8edacc}button,select{font:inherit;padding:10px 16px;border:1px solid #536984;background:#263950;color:white;border-radius:8px;cursor:pointer}button:disabled{opacity:.4}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}#game{width:100%;height:min(68vw,700px);min-height:340px;background:#000;border:1px solid #36465b;border-radius:10px;overflow:hidden}p{line-height:1.7;color:#b8c7db}#status{padding:12px;background:#1c2c40;border-radius:8px}details{margin-top:16px}pre{white-space:pre-wrap;font-size:12px}kbd{padding:2px 6px;background:#283b52;border-radius:4px}.pad button{min-width:70px;touch-action:none}@media(max-width:600px){main{padding:12px}#game{height:68vh;min-height:320px}}</style>
<body><main><a href="/">← 返回资源库</a><h1 id="title">标准街机 · 原游戏运行</h1><p>真实原游戏ROM与模拟器核心。点击加载后在画面中启动，投币、开始、选人进入标准对局；此页独立于角色动画与招式预览。</p>
<div class="controls"><label>游戏 <select id="game-select" aria-label="标准街机游戏"></select></label><label>核心 <select id="core-select" aria-label="原游戏模拟核心"></select></label><button id="launch" disabled>加载标准游戏</button><button id="reload">重新启动</button><button id="pause-core" disabled>暂停游戏</button></div>
<p id="status" role="status">读取本地运行配置…</p><div id="game" tabindex="0" aria-label="原街机游戏画面"></div>
<label>点按时长 <select id="pulse-duration" aria-label="点按时长"><option value="140">短按</option><option value="600">0.6秒</option><option value="1200">1.2秒</option></select></label><div class="controls pad"><button data-key="5" disabled>投币 · 5</button><button data-key="1" disabled>1P开始 · 1</button><button data-key="ArrowLeft" disabled>←</button><button data-key="ArrowUp" disabled>↑</button><button data-key="ArrowDown" disabled>↓</button><button data-key="ArrowRight" disabled>→</button><button data-key="j" disabled>轻拳 · J</button><button data-key="k" disabled>中拳 · K</button><button data-key="l" disabled>重拳 · L</button><button data-key="u" disabled>轻脚 · U</button><button data-key="i" disabled>中脚 · I</button><button data-key="o" disabled>重脚 · O</button></div>
<p id="input-help">方向键移动/选人，<kbd>5</kbd>投币，<kbd>1</kbd>开始，<kbd>J K L</kbd>拳 / <kbd>U I O</kbd>脚。先点一下游戏画面再用键盘；核心自带菜单可改键、接手柄及全屏。不同游戏的按钮用途以原游戏及核心映射为准。</p>
<details><summary>运行证据与配置</summary><p id="verification">候选接入：运行包、ROM与依赖已存本地；尚未完成投币到对局的浏览器验收。</p><a id="receipt" href="#">官方固定版本与逐文件SHA</a><pre id="diagnostics"></pre></details>
</main><script type="module" src="/standard-play.mjs"></script></body></html>
